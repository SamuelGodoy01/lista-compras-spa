<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras SPA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header class="topo">
            <div class="topo-esq">
                <h1>🛒 Lista de Compras</h1>
                <div class="seletor-lista">
                    <label for="selListaAtiva">Lista ativa:</label>
                    <select id="selListaAtiva"></select>
                    <button type="button" id="btnNovaLista" class="btn-mini">+ Nova</button>
                </div>
            </div>

            <nav class="abas">
                <button type="button" class="aba ativa" data-aba="lista">Lista</button>
                <button type="button" class="aba" data-aba="produtos">Produtos</button>
                <button type="button" id="btnTema" class="btn-icone" title="Alternar tema">🌙</button>
                <span id="selo" class="selo" title="Itens pendentes">0</span>
            </nav>
        </header>

        <main class="layout">
            <div class="coluna-formularios">
                <!-- Cadastro de Produto (com categoria e preço estimado) -->
                <section id="secaoProdutos" data-secao="produtos" class="card">
                    <h2>Cadastrar produto</h2>
                    <form id="formProduto">
                        <div class="campo">
                            <label for="nomeProduto">Nome do produto</label>
                            <input type="text" id="nomeProduto" placeholder="Ex.: Açúcar" required>
                        </div>
                        <div class="campo-linha">
                            <div class="campo">
                                <label for="unidade">Unidade</label>
                                <select id="unidade" required>
                                    <option value="un">un</option>
                                    <option value="kg">kg</option>
                                    <option value="g">g</option>
                                    <option value="L">L</option>
                                    <option value="ml">ml</option>
                                    <option value="pct">pct</option>
                                    <option value="dz">dz</option>
                                    <option value="cx">cx</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label for="categoria">Categoria</label>
                                <select id="categoria" required>
                                    <option value="Mercearia">Mercearia</option>
                                    <option value="Hortifrúti">Hortifrúti</option>
                                    <option value="Laticínios">Laticínios</option>
                                    <option value="Limpeza">Limpeza</option>
                                    <option value="Bebidas">Bebidas</option>
                                    <option value="Açougue e Frios">Açougue e Frios</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                        </div>
                        <div class="campo">
                            <label for="precoUnitario">Preço estimado por unidade (R$)</label>
                            <input type="number" id="precoUnitario" min="0" step="0.01" placeholder="0,00" value="0">
                        </div>
                        <button type="submit" class="btn-primario">CADASTRAR</button>
                        <p id="msgProduto" class="msg" aria-live="polite"></p>
                    </form>

                    <div class="produtos-cadastrados">
                        <h3>Produtos cadastrados</h3>
                        <ul id="listaProdutos" class="lista-simples"></ul>
                    </div>
                </section>

                <!-- Adicionar à Lista -->
                <section class="card form-adicionar-desktop">
                    <h2>Adicionar à lista</h2>
                    <form id="formLista">
                        <div class="campo">
                            <label for="selProduto">Produto</label>
                            <select id="selProduto" required>
                                <option value="">Selecione um produto</option>
                            </select>
                        </div>
                        <div class="campo-linha">
                            <div class="campo">
                                <label for="quantidade">Quantidade</label>
                                <input type="number" id="quantidade" min="0.01" step="0.01" placeholder="Qtde" required>
                            </div>
                            <span id="unidadeSel" class="unidade-badge">-</span>
                        </div>
                        <button type="submit" class="btn-primario">ADICIONAR</button>
                        <p id="msgLista" class="msg" aria-live="polite"></p>
                    </form>
                </section>
            </div>

            <!-- Minha Lista -->
            <section id="secaoLista" data-secao="lista" class="card">
                <div class="cabecalho-lista">
                    <h2 id="tituloListaAtiva">Minha lista</h2>
                    <button type="button" id="btnLimparComprados" class="btn-secundario">Limpar comprados</button>
                </div>

                <div class="contadores">
                    <div class="cartao-contador">
                        <span>Total</span>
                        <strong id="cTotal">0</strong>
                    </div>
                    <div class="cartao-contador">
                        <span>Comprados</span>
                        <strong id="cComprados">0</strong>
                    </div>
                    <div class="cartao-contador">
                        <span>Pendentes</span>
                        <strong id="cPendentes">0</strong>
                    </div>
                    <div class="cartao-contador destaque-valor">
                        <span>Total estimado</span>
                        <strong id="cTotalPreco">R$ 0,00</strong>
                    </div>
                </div>

                <div class="barra-filtros" role="group" aria-label="Filtrar itens">
                    <button type="button" class="filtro ativa" data-filtro="todos">Todos</button>
                    <button type="button" class="filtro" data-filtro="pendentes">Pendentes</button>
                    <button type="button" class="filtro" data-filtro="comprados">Comprados</button>
                </div>

                <p id="vazia" class="estado-vazio">🛒 Sua lista está vazia. Adicione um produto!</p>
                <ul id="lista" class="lista-compras"></ul>
            </section>
        </main>

        <footer class="rodape">
            <button type="button" id="btnExportarProdutos" class="btn-outline">⬇ Exportar produtos.json</button>
            <button type="button" id="btnExportarLista" class="btn-outline">⬇ Exportar lista.json</button>
            <button type="button" id="btnSalvarDireto" class="btn-outline">💾 Salvar direto em arquivo</button>
            <label class="btn-outline upload-label">
                ⬆ Importar .json
                <input type="file" id="arquivoJson" accept=".json" hidden>
            </label>
        </footer>
    </div>

    <script src="js/dados.js"></script>
    <script src="js/interface.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
